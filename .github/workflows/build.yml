name: Kernel Build Process
permissions:
  contents: read   # pong-kernel: read-only; nothing on the pong.yml path pushes or deletes caches (use_cache=false)
  actions: read

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      runner:
        description: 'Runner image label (ubuntu-24.04 or ubuntu-latest); lets a single leg be A/B tested'
        required: false
        type: string
        default: 'ubuntu-24.04'
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: ""
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      bbg_commit:
        required: false
        type: string
        default: ""
      common_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        required: false
        type: string
        default: Wild
      keep_kmi:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Enable ccache/bazel cache (restore/save via release buckets)"
        required: false
        type: boolean
        default: false
      page_size:
        description: "ARM64 page size: 4k (default) or 16k (Kleaf --page_size)"
        required: false
        type: string
        default: "4k"
      stock_config_artifact:
        description: "Artifact name with prefetched stock configs (stock_<kver>[_16k].config)"
        required: false
        type: string
        default: ""

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.variant }})"
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Prefetched Stock Configs
        if: inputs.stock_config_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.stock_config_artifact }}
          path: stock-configs

      - name: Validate Page Size
        shell: bash
        run: |
          set -euo pipefail
          PAGE_SIZE="${{ inputs.page_size }}"
          case "$PAGE_SIZE" in
            4k) exit 0 ;;
            16k) ;;
            *) echo "ERROR: unsupported page_size '$PAGE_SIZE' (expected 4k or 16k)." >&2; exit 1 ;;
          esac
          # Kleaf exposes --page_size only on the build branches used by these
          # GKI families (main-kernel-build-2023/2024, main-kernel-2025).
          case "${{ inputs.version }}" in
            android14-6.1|android15-6.6|android16-6.12) ;;
            *)
              echo "ERROR: page_size=16k is not supported for ${{ inputs.version }}." >&2
              echo "Supported families: android14-6.1, android15-6.6, android16-6.12." >&2
              exit 1
              ;;
          esac

      - name: Emergency Disk Cleanup
        if: false
        uses: ./.github/actions/disk-cleanup

      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz" # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.2.0" # Required when rm_cmd is 'rmz'
          testing: false

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: ${{ inputs.version }}
          sublevel: ${{ inputs.sublevel }}
          kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
          anykernel3_commit: ${{ inputs.anykernel3_commit }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          common_commit: ${{ inputs.common_commit }}

      - name: Spoof /proc/config.gz With Stock Config
        uses: ./.github/actions/stock-config
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          stock_config_dir: stock-configs

      - name: Set Build Timestamp from Kernel Commit
        shell: bash
        run: |
          set -x
          # Hardcode the build timestamp to the 5th day of the patch level
          # at 04:20 UTC, using the existing timestamp formats expected by the build.
          OS_PATCH_LEVEL_INPUT="${{ inputs.os_patch_level }}"
          if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
            if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
              OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
            else
              OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
            fi
          else
            OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
          fi
          FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
          SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
          echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
          # Keep git metadata aligned with the same fixed timestamp.
          GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
          echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Reject KowSU with SUSFS
        if: inputs.root_flavor == 'kowsu' && (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All')
        shell: bash
        run: |
          echo "ERROR: KowSU does not work together with SUSFS — re-run with SUSFS off." >&2
          exit 1

      - name: Reject FinaSU without SUSFS
        # FinaSU's kernel hard-depends on the susfs headers and its supercall
        # dispatch references susfs symbols unguarded, so a susfs-less build
        # cannot link. Unlike KernelSU/BakaSU there is no susfs-free shape.
        if: inputs.root_flavor == 'finasu' && !contains(inputs.feature_set, 'SUSFS')
        shell: bash
        run: |
          echo "ERROR: FinaSU requires SUSFS — re-run with SUSFS on." >&2
          exit 1

      - name: Setup Selected Root Implementation
        if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/root-setup
        with:
          flavor: ${{ inputs.root_flavor }}
          commit: ${{ inputs.root_commit }}

      - name: Mark No Root build metadata
        if: inputs.root_flavor == 'none'
        shell: bash
        run: |
          {
            echo "ROOT_IMPLEMENTATION=none"
            echo "ROOT_MANAGER=N/A"
            echo "ROOT_VERSION=N/A"
            echo "ROOT_COMMIT=N/A"
          } >> "$GITHUB_ENV"

      - name: Disable SUSFS for BakaSU without SUSFS feature
        if: inputs.root_flavor == 'bakasu' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: Disable SUSFS for SukiSU-Ultra without SUSFS feature
        if: inputs.root_flavor == 'sukisu-ultra' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: SUSFS
        # One step, one action: resolve the SUSFS commit, apply it for the
        # selected root, then run the post-patch fixes (ksu_close_fd restore,
        # selinux_hide 6.6+ shim). All of that lives in
        # .github/actions/susfs/action.yml - the workflow no longer carries
        # SUSFS shell code.
        uses: ./.github/actions/susfs
        with:
          enabled: ${{ contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All' }}
          susfs_commit: ${{ inputs.susfs_commit }}
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          root_flavor: ${{ inputs.root_flavor }}

      - name: Baseband Guard
        if: (contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'All')
        uses: ./.github/actions/bbg
        with:
          commit: ${{ inputs.bbg_commit }}

      - name: Setup Networking
        if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
        uses: ./.github/actions/networking
        with:
          os_patch_level: ${{ inputs.os_patch_level }}
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: DroidSpaces-OSS Patches
        if: contains(inputs.feature_set, 'DS') || inputs.feature_set == 'All'
        uses: ./.github/actions/droidspaces
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          droidspaces_commit: ${{ inputs.droidspaces_commit }}

      - name: Apply NTSync Patches
        if: contains(inputs.feature_set, 'NTSync')
        uses: ./.github/actions/ntsync
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        if: contains(inputs.feature_set, 'Ptrace')
        uses: ./.github/actions/ptrace
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Unicode Fix Patch
        if: contains(inputs.feature_set, 'Unicode')
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Performance Patches
        uses: ./.github/actions/performance
        if: contains(inputs.feature_set, 'Perf')
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Setup Misc Configs
        uses: ./.github/actions/misc
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          variant: ${{ inputs.variant }}

      - name: Enable BPF Stack (BTF + eBPF + FUSE-BPF)
        if: contains(inputs.feature_set, 'BPF')
        uses: ./.github/actions/btf
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      # NetHunter: the only gadget functions r22 lacks (HID is already =y) + bridge MITM.
      # Driver module is added by the separate "NetHunter WiFi Driver" step below.
      - name: NetHunter Kernel Config
        if: contains(inputs.feature_set, 'NetHunter')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_USB_CONFIGFS_OBEX=y
            CONFIG_USB_CONFIGFS_ECM_SUBSET=y
            CONFIG_USB_CONFIGFS_RNDIS=y
            CONFIG_BRIDGE_NETFILTER=y

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Integrate NoMount
        if: contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All'
        uses: ./.github/actions/nomount
        with:
          commit: ${{ inputs.nomount_commit }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: ${{ inputs.variant }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          version: ${{ inputs.version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          brand_name: ${{ inputs.brand_name }}
          keep_kmi: ${{ inputs.keep_kmi }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: "Setup Cache and Build Environment"
        if: inputs.use_cache
        uses: ./.github/actions/cache-setup
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Restore ccache
        id: restore-ccache
        continue-on-error: true
        if: inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
          cache_bucket: ccache-cache-${{ inputs.version }}-${{ inputs.variant }}
          restore_keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

      - name: Restore bazel-cache
        id: restore-bazel
        continue-on-error: true
        if: inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          cache_bucket: bazel-cache-${{ inputs.version }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          restore_keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

      - name: Check cache hit
        run: |
          echo "Cache restore status:"
          CCACHE_HIT="${{ steps.restore-ccache.outputs.cache-hit || 'skipped' }}"
          BAZEL_HIT="${{ steps.restore-bazel.outputs.cache-hit || 'skipped' }}"
          echo "  ccache: $CCACHE_HIT"
          echo "  bazel: $BAZEL_HIT"

      - name: Get Cache Stats
        uses: ./.github/actions/cache-stats
        with:
          clear_stats: true

      - name: Initialize Config Fragment
        run: touch "${{ github.workspace }}/wild_gki.fragment"

      - name: Apply Kernel Bypass Hack
        if: ${{ inputs.allow_version_mismatch == 'true' }}
        uses: ./.github/actions/bypass-kernel
        with:
          version: ${{ inputs.version }}
          allow_version_mismatch: true

      - name: Fetch NetHunter WiFi Driver (rtl8812au, out-of-tree)
        if: contains(inputs.feature_set, 'RtlDriver')
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          # Fullmac RTL8812AU built OOT against the just-built GKI, so modversion CRCs
          # come from THIS kernel's Module.symvers (= r22 KMI, no config deltas). Pinned.
          DRV_PIN=734485506a30d6237c2deaad666a19f8ca5379f2
          git clone https://github.com/aircrack-ng/rtl8812au 8812au
          git -C 8812au -c advice.detachedHead=false checkout "$DRV_PIN"
          sed -i 's/^CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' 8812au/Makefile
          sed -i 's/^CONFIG_PLATFORM_ANDROID_ARM64 = n/CONFIG_PLATFORM_ANDROID_ARM64 = y/' 8812au/Makefile
          # The ANDROID_ARM64 block sets only EXTRA_CFLAGS and leaves KSRC empty, so the
          # standalone "modules:" recipe runs "-C <empty>" and dies. build.sh drives this
          # Makefile with KERNEL_SRC=<kernel tree> (and O=/LLVM=1 as command-line vars that
          # propagate to the inner $(MAKE)); point KSRC at that so -C hits the real tree.
          sed -i '/^ifeq (\$(CONFIG_PLATFORM_ANDROID_ARM64), y)/a KSRC := $(KERNEL_SRC)' 8812au/Makefile
          # Drop two GCC-only global warning flags: the GKI prebuilt clang-12 rejects them
          # under -Werror,-Wunknown-warning-option. All other -Wno-* flags are clang-known.
          sed -i 's/^EXTRA_CFLAGS += -Wno-cast-function-type$/#&  # clang: unknown warning option/' 8812au/Makefile
          sed -i 's/^EXTRA_CFLAGS += -Wno-stringop-overread$/#&  # clang: unknown warning option/' 8812au/Makefile
          # The GKI kernel compiles OOT modules under its own global -Werror; this
          # out-of-tree driver carries genuine -W{,sometimes-}uninitialized warnings.
          # Demote -Werror for the module only so those stay warnings (CRCs unaffected).
          sed -i '0,/^EXTRA_CFLAGS += /s//EXTRA_CFLAGS += -Wno-error  # GKI builds OOT modules with global -Werror; demote for this driver\n&/' 8812au/Makefile
          # The ANDROID_ARM64 preset enables RTW_ENABLE_WIFI_CONTROL_FUNC, an embedded
          # GPIO/platform wifi power-sequencing feature meant for SDIO chips, not a USB
          # adapter. It #includes <linux/wlan_plat.h>, which GKI 5.10 does not ship. The
          # driver defines inline no-op stubs when the macro is off, so dropping it compiles
          # the feature (and the missing header) out cleanly. Every other macro the block
          # sets (CONFIG_RADIO_WORK, CONFIG_IOCTL_CFG80211, CFG80211 shims, P2P_IPS) is USB-
          # relevant and kept. earlysuspend.h/wakelock.h stay gated off (their configs unset).
          sed -i 's/^EXTRA_CFLAGS += -DRTW_ENABLE_WIFI_CONTROL_FUNC -DCONFIG_RADIO_WORK$/EXTRA_CFLAGS += -DCONFIG_RADIO_WORK  # dropped RTW_ENABLE_WIFI_CONTROL_FUNC (pulls GKI-absent linux\/wlan_plat.h)/' 8812au/Makefile
          grep -nE '^CONFIG_PLATFORM_(I386_PC|ANDROID_ARM64) =|^KSRC := \$\(KERNEL_SRC\)|Wno-cast-function-type|Wno-stringop-overread|^EXTRA_CFLAGS \+= -Wno-error|^EXTRA_CFLAGS \+= -DCONFIG_RADIO_WORK' 8812au/Makefile

          # --- Strategy 2b: resolve the 31 cfg80211/mac80211 imports against r22's stock KMI ---
          # These symbols live in the device's cfg80211/mac80211 GKI modules, not in vmlinux,
          # so modpost cannot see them from vmlinux.symvers alone and errors "undefined!".
          # Feed it a committed stock symbol+CRC table (public GKI exports, no device IDs) via
          # KBUILD_EXTRA_SYMBOLS so the module's __versions carry the device's stock CRCs.
          cp "${{ github.workspace }}/.github/wifi/stock-wifi.symvers" 8812au/stock-wifi.symvers
          DRV_ABS="$PWD/8812au"
          # Primary (architect's mechanism): top-level make var in the module Makefile, read in
          # the kbuild pass. Plus an env export as backup (build.sh passes env through to kbuild).
          echo "KBUILD_EXTRA_SYMBOLS := $DRV_ABS/stock-wifi.symvers" >> 8812au/Makefile
          echo "KBUILD_EXTRA_SYMBOLS=$DRV_ABS/stock-wifi.symvers" >> "$GITHUB_ENV"
          echo "stock-wifi.symvers entries: $(wc -l < 8812au/stock-wifi.symvers)  path: $DRV_ABS/stock-wifi.symvers"
          grep -n KBUILD_EXTRA_SYMBOLS common/scripts/Makefile.modpost || echo "note: no literal KBUILD_EXTRA_SYMBOLS in Makefile.modpost; make-var/env path still applies"

          # --- Strip the 4 symbols absent from r22's trimmed vmlinux KMI (debug / optional
          # file-I/O only; NOT the USB probe, cfg80211 registration, or monitor/injection path) ---
          # proc_get_parent_data: whole /proc debug iface is gated by CONFIG_PROC_DEBUG; disable it
          # (callers fall back to no-op stub macros in rtw_proc.h).
          sed -i 's|^#define CONFIG_PROC_DEBUG$|/* #define CONFIG_PROC_DEBUG */  /* disabled: proc_get_parent_data not in r22 KMI (debug-only) */|' 8812au/include/rtl_autoconf.h
          # kernel_read/kernel_write: only in readFile/writeFile (optional PHY-param/FW-from-file;
          # built-in arrays are the default). Return -EINVAL so callers take the built-in path.
          sed -i 's|rlen = kernel_read(fp, buf + sum, len - sum, &fp->f_pos);|rlen = -EINVAL;  /* kernel_read not in r22 KMI; file I/O disabled, built-in arrays used */|' 8812au/os_dep/osdep_service.c
          sed -i 's|wlen = kernel_write(fp, buf + sum, len - sum, &fp->f_pos);|wlen = -EINVAL;  /* kernel_write not in r22 KMI; file I/O disabled */|' 8812au/os_dep/osdep_service.c
          # yield(): only in rtw_yield_os(); schedule() is equivalent here and is KMI-exported.
          sed -i 's|^\tyield();|\tschedule();  /* yield() not in r22 KMI */|' 8812au/os_dep/osdep_service.c
          echo "post-strip check (expect no live kernel_read/kernel_write/yield() lines):"
          grep -nE 'kernel_read|kernel_write|^\tyield\(\);' 8812au/os_dep/osdep_service.c || echo "  none remain"
          grep -nE '#define CONFIG_PROC_DEBUG' 8812au/include/rtl_autoconf.h || echo "  CONFIG_PROC_DEBUG disabled"

          # --- Re-provide the 9 PROC_DEBUG-gated helpers that always-on code still calls ---
          # Disabling CONFIG_PROC_DEBUG above also drops these small helper/test hooks, yet core
          # always-on code calls them: rtw_cmd.c (AP hi-queue wait), rtw_mlme_ext.c (sta/ap
          # linking-test hooks), rtl8812a_hal_init.c (fwdl-test hooks) -> implicit-declaration
          # (fatal under GKI -Werror) and, if silenced, undefined symbols at modpost/link.
          # Re-add them with upstream production defaults (g_wait_hiq_empty_ms is 0; every test
          # hook returns "no forced failure"), gated #ifndef CONFIG_PROC_DEBUG so the real
          # definitions win whenever proc-debug is enabled. Module-internal only (no KMI impact).
          awk 'BEGIN{
            print "";
            print "#ifndef CONFIG_PROC_DEBUG";
            print "/* r22 NetHunter shim: CONFIG_PROC_DEBUG off (proc_get_parent_data absent from the";
            print "   trimmed GKI KMI). These live under CONFIG_PROC_DEBUG upstream but are called by";
            print "   always-on code; provide production-default bodies. */";
            print "u32 rtw_get_wait_hiq_empty_ms(void) { return 0; }";
            print "void rtw_sta_linking_test_set_start(void) {}";
            print "bool rtw_sta_linking_test_wait_done(void) { return _TRUE; }";
            print "bool rtw_sta_linking_test_force_fail(void) { return _FALSE; }";
            print "u16 rtw_ap_linking_test_force_auth_fail(void) { return 0; }";
            print "u16 rtw_ap_linking_test_force_asoc_fail(void) { return 0; }";
            print "bool rtw_del_rx_ampdu_test_trigger_no_tx_fail(void) { return _FALSE; }";
            print "bool rtw_fwdl_test_trigger_chksum_fail(void) { return _FALSE; }";
            print "bool rtw_fwdl_test_trigger_wintint_rdy_fail(void) { return _FALSE; }";
            print "#endif /* !CONFIG_PROC_DEBUG */";
          }' >> 8812au/core/rtw_debug.c
          # Matching prototypes, inserted just before the rtw_debug.h include-guard #endif so the
          # call sites in other translation units see real declarations (not implicit int).
          awk '/#endif \/\* __RTW_DEBUG_H__ \*\// && !d{
            print "#ifndef CONFIG_PROC_DEBUG";
            print "u32 rtw_get_wait_hiq_empty_ms(void);";
            print "void rtw_sta_linking_test_set_start(void);";
            print "bool rtw_sta_linking_test_wait_done(void);";
            print "bool rtw_sta_linking_test_force_fail(void);";
            print "u16 rtw_ap_linking_test_force_auth_fail(void);";
            print "u16 rtw_ap_linking_test_force_asoc_fail(void);";
            print "bool rtw_del_rx_ampdu_test_trigger_no_tx_fail(void);";
            print "bool rtw_fwdl_test_trigger_chksum_fail(void);";
            print "bool rtw_fwdl_test_trigger_wintint_rdy_fail(void);";
            print "#endif /* !CONFIG_PROC_DEBUG */";
            d=1
          }1' 8812au/include/rtw_debug.h > 8812au/include/rtw_debug.h.new
          mv 8812au/include/rtw_debug.h.new 8812au/include/rtw_debug.h
          echo "proc-debug shim: $(grep -c 'void) { return\|void) {}' 8812au/core/rtw_debug.c) defs appended; decl block present: $(grep -c '^#ifndef CONFIG_PROC_DEBUG' 8812au/include/rtw_debug.h)"
          # build.sh runs a "modules_install" pass on the ext module, but the aircrack
          # Makefile has no modules_install target (only a local-system install: needing
          # MODDESTDIR/KVER we do not set) -> "No rule to make target modules_install" (exit 2)
          # AFTER 88XXau.ko already linked. The .ko is collected straight from the build tree
          # below (it is never baked into the kernel image; it loads on-demand via insmod),
          # so a no-op modules_install target lets build.sh finish cleanly.
          printf '\nmodules_install:\n\t@echo "ext-module install skipped; .ko collected from build tree"\n' >> 8812au/Makefile
          sed -i 's/^\.PHONY: modules clean/.PHONY: modules modules_install clean/' 8812au/Makefile
          grep -nE '^modules_install:|^\.PHONY:' 8812au/Makefile

      - name: Build Normal Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          KBUILD_BUILD_USER: ${{ (inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12') && 'kleaf' || 'build-user' }}
          KBUILD_BUILD_HOST: build-host
        uses: ./.github/actions/build-kernel
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          ext_modules: ${{ contains(inputs.feature_set, 'RtlDriver') && '8812au' || '' }}

      - name: Get Cache Stats
        uses: ./.github/actions/cache-stats
        with:
          clear_stats: false

      - name: Prune ccache before save
        if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        shell: bash
        run: |
          if [ -d /home/runner/.ccache ]; then
            ccache -c 2>/dev/null || true
            find /home/runner/.ccache -type f -mtime +0.5 -delete 2>/dev/null || true
            find /home/runner/.ccache -type d -empty -delete 2>/dev/null || true
            echo "ccache pruned"; ccache -s 2>/dev/null | head -20 || true
          fi

      - name: Save ccache
        continue-on-error: true
        uses: ./.github/actions/cache-save
        if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
          cache_bucket: "ccache-cache-${{ inputs.version }}-${{ inputs.variant }}"
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Save bazel-cache
        continue-on-error: true
        uses: ./.github/actions/cache-save
        if: always() && inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          cache_bucket: "bazel-cache-${{ inputs.version }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}"
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Consolidated Build Summary
        id: build-summary
        if: always()
        uses: ./.github/actions/build-summary
        with:
          job_status: ${{ job.status }}
          file_name: ${{ steps.extract.outputs.file_name }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          android_version: ${{ inputs.android_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}
          feature_set: ${{ inputs.feature_set }}
          nomount_commit: ${{ inputs.nomount_commit }}
          susfs_commit: ${{ inputs.susfs_commit }}

      - name: Upload Artifacts
        id: kernel-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: ignore
          compression-level: 9

      - name: Collect rtl8812au module
        if: contains(inputs.feature_set, 'RtlDriver')
        shell: bash
        run: |
          set -uo pipefail
          KO="$(find /home/runner/out /home/runner/work -name '88XXau.ko' -type f 2>/dev/null | head -n1)"
          if [ -z "$KO" ]; then
            echo "88XXau.ko NOT found under /home/runner/out — ext-module build failed." >&2
            find /home/runner/out -name '*.ko' 2>/dev/null | grep -i 8812 || true
            exit 1
          fi
          mkdir -p "${{ github.workspace }}/rtl8812au-out"
          cp "$KO" "${{ github.workspace }}/rtl8812au-out/"
          modinfo "$KO" 2>/dev/null | head -20 || true
          sha256sum "${{ github.workspace }}/rtl8812au-out/88XXau.ko"
      - name: Upload rtl8812au artifact
        if: contains(inputs.feature_set, 'RtlDriver')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-rtl8812au
          path: ${{ github.workspace }}/rtl8812au-out/**
          if-no-files-found: error
          compression-level: 9
      - name: Upload Build Summary + Metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-BuildInfo
          path: /tmp/build-summary-${{ steps.build-summary.outputs.summary_base }}.md
          if-no-files-found: warn
          compression-level: 9
